<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O Anuário</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #061a33 0%, #0d2b52 32%, #173f79 58%, #071b31 100%);
            color: #eff6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .page {
            width: min(900px, 100%);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 28px;
            box-shadow: 0 24px 60px rgba(3, 12, 26, 0.34);
            padding: 40px 30px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2.2rem, 5vw, 4rem);
            color: #dbeafe;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #dfefff;
        }

        .buttons {
            margin-top: 28px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            color: white;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: #eff6ff;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <main class="page">
        <h1>O Anuário</h1>
        </p>Anuário anglo 2026.</p>
        <p>Você pode usar essa página como versão detalhada da apresentação, uma galeria, ou até como página de apresentação de turmas e lembranças.</p>
    
        <div class="buttons">
            <a class="btn btn-primary" href="MainPage%20-%20Copia.html">Voltar para a página inicial</a>
        </div>
    </main>
</body>
</html>
